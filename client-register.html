<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Jamoko Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center py-8">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4">
        <div class="text-center mb-8">
            <i class="fas fa-rocket text-5xl text-purple-600 mb-2"></i>
            <h2 class="text-2xl font-bold">Start Your Hotspot Business</h2>
            <p class="text-gray-600">Join Jamoko Links today</p>
        </div>
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Business Name</label>
                <input type="text" id="businessName" class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Cyber Cafe Hotspot" required>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Email Address</label>
                <input type="email" id="email" class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="your@business.com" required>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Phone Number</label>
                <input type="tel" id="phone" class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="0712345678" required>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">M-Pesa Paybill (Optional)</label>
                <input type="text" id="paybill" class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="123456">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="••••••" required>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="••••••" required>
            </div>
            <button type="submit" class="w-full gradient-bg text-white py-3 rounded-lg font-semibold hover:opacity-90 transition">Create Account →</button>
        </form>
        <p class="text-center text-gray-600 text-sm mt-6">
            Already have an account? <a href="client-login.html" class="text-purple-600 font-semibold">Login here</a>
        </p>
    </div>
    <script src="js/client.js"></script>
    <script>
        async function handleRegister(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (password !== confirm) {
                alert('Passwords do not match');
                return;
            }

            const businessName = document.getElementById('businessName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const paybill = document.getElementById('paybill').value;

            try {
                const response = await ClientAPI.register({
                    name: businessName,
                    business_name: businessName,
                    email,
                    phone,
                    paybill,
                    password,
                    password_confirmation: password
                });

                const token = response.token || response.access_token || response.data?.token;
                const user = response.user || response.data?.user || {};
                if (!token) {
                    throw new Error(response.message || 'Registration response missing authentication token');
                }

                localStorage.setItem('clientToken', token);
                localStorage.setItem('clientLoggedIn', 'true');
                localStorage.setItem('clientEmail', email);
                localStorage.setItem('clientBusiness', user.business_name || user.name || businessName);
                localStorage.setItem('clientPhone', phone);
                localStorage.setItem('clientPaybill', paybill);
                window.location.href = 'client-dashboard.html';
            } catch (error) {
                alert(error.message || 'Unable to register. Please check your information and try again.');
            }
        }
    </script>
</body>
</html>
